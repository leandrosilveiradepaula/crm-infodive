name: CRM tenant isolation PostgreSQL 16

on:
  pull_request:
    branches: [main, 'preview/**']
    paths:
      - 'supabase/migrations/20261026204500_crm_authoritative_tenant_rls.sql'
      - 'scripts/verify_crm_tenant_hardening_pg.py'
      - 'src/lib/auth-server.ts'
      - 'src/app/login/actions.ts'
      - 'test/auth-tenant-boundary.test.ts'
      - '.github/workflows/crm-tenant-security-postgres.yml'

permissions:
  contents: read

jobs:
  crm-rls-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crm_ci
          POSTGRES_PASSWORD: crm_ci
          POSTGRES_DB: crm_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm_ci -d crm_rls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install fixed PostgreSQL client
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Exercise real RLS with signed-claim spoofing and cross-org denials
        env:
          CRM_RLS_ISOLATED_TEST: 'true'
          CRM_RLS_ISOLATED_TEST_DSN: 'postgresql://crm_ci:crm_ci@127.0.0.1:5432/crm_rls_test'
        run: python scripts/verify_crm_tenant_hardening_pg.py
