name: CRM B4 real local authenticated QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: crm-b4-local-authenticated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  nextjs-local-e2e:
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'ux-ui/crm214-b4-integrated-qa' || startsWith(github.head_ref, 'codex/issue-214-ux-recovery-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install CRM dependencies
        run: npm ci
      - name: Install pinned Supabase CLI v2 (local only)
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3 release, CLI pinned to v2 channel
        with:
          version: v2.stable
      - name: Start pristine ephemeral Supabase (no hosted project, no secrets)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/crm-b4-local-stack"
          cd "$RUNNER_TEMP/crm-b4-local-stack"
          supabase init
          if ! supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor >"$RUNNER_TEMP/crm-b4-local-start.log" 2>&1; then
            echo "CRM_B4_LOCAL_STACK=BLOCKED: local Supabase startup failed; no remote target was contacted."
            grep -Ei 'error:|failed|migration' "$RUNNER_TEMP/crm-b4-local-start.log" | sed -E 's/(eyJ[A-Za-z0-9._-]{20,}|sb_secret_[A-Za-z0-9_-]+)/[redacted]/g' | head -25 || true
            exit 1
          fi
          supabase status -o env > "$RUNNER_TEMP/crm-b4-local-status.env"
          node "$GITHUB_WORKSPACE/test/e2e/local-qa/export-local-status.mjs" "$RUNNER_TEMP/crm-b4-local-status.env"
      - name: Bootstrap QA-only commercial schema with synthetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$NEXT_PUBLIC_SUPABASE_URL" = "http://127.0.0.1:54321"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          for sql in QA_SUPABASE_IDENTITY_BASELINE.sql QA_SUPABASE_COMMERCIAL_SCHEMA.sql QA_SYNTHETIC_FIXTURES.sql; do
            echo "CRM_B4_LOCAL_FIXTURE_APPLY=${sql}"
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
              -f "$GITHUB_WORKSPACE/docs/ui/$sql" >"$RUNNER_TEMP/crm-b4-fixture.log" 2>&1 || {
              tail -35 "$RUNNER_TEMP/crm-b4-fixture.log"
              exit 1
            }
          done
          # PostgREST may have cached the empty public schema before SQL was
          # applied. Explicitly reload, then the local provisioner waits for
          # the known temporary PGRST schema-cache response to clear.
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -c "NOTIFY pgrst, 'reload schema';" >/dev/null
          echo "CRM_B4_LOCAL_FIXTURE=READY; schema_reload=requested"
        env:
          PGPASSWORD: postgres
      - name: Provision four real local Auth users and two isolated tenants
        run: node test/e2e/local-qa/provision-local-auth.mjs
      - name: Compile real Next.js application against local-only backend
        run: npm run build
      - name: Install pinned browser toolchain for full authenticated matrix
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.64.1 axe-core@4.14.0
      - name: Audit real Next.js pages (four roles, 22-route matrix, mobile/desktop, both themes)
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 >"$RUNNER_TEMP/crm-b4-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/login; then ready=true; break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            echo "CRM_B4_REAL_NEXT=BLOCKED: server did not become ready"
            grep -Ei 'error:|failed' "$RUNNER_TEMP/crm-b4-next.log" | head -20 || true
            exit 1
          fi
          export CHROME_PATH
          CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          export CRM_E2E_CAPTURE_SANITIZED=true
          export CRM_E2E_ARTIFACT_DIR="$RUNNER_TEMP/crm-b4-local-visual-evidence"
          node test/e2e/run-authenticated-smoke.mjs
      - name: Upload sanitized local visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crm-b4-local-visual-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/crm-b4-local-visual-evidence
          if-no-files-found: warn
          retention-days: 7
      - name: Stop and destroy only the disposable local Supabase stack
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/crm-b4-local-stack/supabase/config.toml" ]]; then
            cd "$RUNNER_TEMP/crm-b4-local-stack"
            supabase stop --no-backup >/dev/null 2>&1 || true
          fi
          echo "CRM_B4_LOCAL_STACK=CLEANED"
