name: Temporary xlsx removal

on:
  push:
    branches:
      - ops/remove-vulnerable-xlsx

permissions:
  contents: write

jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Remove vulnerable xlsx dependency
        run: npm uninstall xlsx
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify xlsx advisory is gone
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          if (audit.vulnerabilities?.xlsx) {
            console.error('XLSX_VULNERABILITY_REMAINS');
            process.exit(1);
          }
          console.log('XLSX_VULNERABILITY_REMOVED');
          NODE
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): remove vulnerable xlsx [skip ci]"
          git push origin HEAD:ops/remove-vulnerable-xlsx
