name: CRM validation

on:
  push:
    branches:
      - factory/fix-present-in-usd-safe-rate
      - 'security/**'
      - 'ops/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: New lint errors
        run: node scripts/lint-changed.mjs
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          merge_base="$(git merge-base "origin/$base_ref" HEAD)"
          git diff --check "$merge_base"..HEAD
