name: CRM validation

on:
  push:
    branches:
      - factory/fix-present-in-usd-safe-rate
  pull_request:
    branches:
      - main
      - 'preview/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install pinned browser QA tools with runtime integrity verification
        run: node scripts/install-isolated-browser-qa.mjs
      - name: Synthetic browser WCAG A/AA preflight (desktop/mobile, light/dark)
        run: node test/e2e/run-component-a11y.mjs
      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          merge_base="$(git merge-base "origin/$base_ref" HEAD)"
          git diff --check "$merge_base"..HEAD
          node --test test/design-token-guard.check.mjs
          node scripts/check-design-token-policy.mjs "$merge_base"
          node scripts/report-design-system-debt.mjs --summary
