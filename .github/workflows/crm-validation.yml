name: CRM validation

on:
  push:
    branches:
      - factory/fix-present-in-usd-safe-rate
  pull_request:
    branches:
      - main
      - 'preview/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install isolated browser QA toolchain (no protected secrets)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.64.1 axe-core@4.14.0
      - name: Synthetic browser WCAG A/AA preflight (desktop/mobile, light/dark)
        run: node test/e2e/run-component-a11y.mjs
      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          merge_base="$(git merge-base "origin/$base_ref" HEAD)"
          git diff --check "$merge_base"..HEAD
