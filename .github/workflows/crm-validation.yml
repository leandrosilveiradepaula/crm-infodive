name: CRM validation

on:
  push:
    branches:
      - factory/fix-present-in-usd-safe-rate
  pull_request:
    branches:
      - main
      - 'preview/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Source-only shallow checkout for the owner-authorized final audit.
      # The artifact excludes runner config, credentials, working data and history.
      - name: Package exact candidate shallow checkout for local audit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'codex/issue-214-ux-recovery-final-audit-20261125' || github.head_ref == 'codex/issue-214-ux-recovery-product-readiness-20261126')
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git branch crm-audit-source-snapshot "$EXPECTED_SHA"
          snapshot="$RUNNER_TEMP/crm-audit-source-snapshot"
          git clone --no-local --depth 1 --single-branch --no-checkout --branch crm-audit-source-snapshot "file://$GITHUB_WORKSPACE" "$snapshot"
          git -C "$snapshot" remote remove origin
          test -f "$snapshot/.git/shallow"
          test "$(git -C "$snapshot" rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C "$snapshot" rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git -C "$snapshot" remote)"
          mkdir "$RUNNER_TEMP/crm-audit-checkout-evidence"
          tar -C "$snapshot" -czf "$RUNNER_TEMP/crm-audit-checkout-evidence/checkout.tar.gz" .git
          printf '%s\n%s\n' "$EXPECTED_SHA" "$(git rev-parse 'HEAD^{tree}')" > "$RUNNER_TEMP/crm-audit-checkout-evidence/provenance.txt"
          git branch -D crm-audit-source-snapshot
      - name: Upload exact candidate shallow checkout
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'codex/issue-214-ux-recovery-final-audit-20261125' || github.head_ref == 'codex/issue-214-ux-recovery-product-readiness-20261126')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-final-audit-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/crm-audit-checkout-evidence
          if-no-files-found: error
          retention-days: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Render real proposals with default and organization brand colors
        shell: bash
        env:
          CRM_PROPOSAL_EVIDENCE_DIR: ${{ runner.temp }}/crm-proposal-pdf-evidence
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null || ! command -v pdftoppm >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils
          fi
          node test/e2e/run-proposal-document-render.mjs
      - name: Upload synthetic proposal render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-proposal-pdf-evidence
          path: ${{ runner.temp }}/crm-proposal-pdf-evidence
          if-no-files-found: ignore
          retention-days: 7
      - name: Install pinned browser QA tools with runtime integrity verification
        run: node scripts/install-isolated-browser-qa.mjs
      - name: Synthetic browser WCAG A/AA preflight (desktop/mobile, light/dark)
        run: node test/e2e/run-component-a11y.mjs
      - name: Diff check
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref"
          merge_base="$(git merge-base "origin/$base_ref" HEAD)"
          git diff --check "$merge_base"..HEAD
          node --test test/design-token-guard.check.mjs
          node scripts/check-design-token-policy.mjs "$merge_base"
          node scripts/report-design-system-debt.mjs --summary
