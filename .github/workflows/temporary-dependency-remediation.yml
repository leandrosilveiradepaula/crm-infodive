name: Temporary dependency remediation

on:
  push:
    branches:
      - ops/dependency-remediation-critical

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update critical direct dependencies
        run: npm install --save-exact next@16.4.0 eslint-config-next@16.4.0 jspdf@4
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify direct critical advisories are remediated
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > /tmp/audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const vulnerable = ['next','jspdf'].filter((name) => audit.vulnerabilities?.[name]?.severity === 'critical');
          if (vulnerable.length) {
            console.error('DIRECT_CRITICAL_REMAINS=' + vulnerable.join(','));
            process.exit(1);
          }
          console.log('DIRECT_CRITICAL_REMEDIATED=next,jspdf');
          NODE
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated"
            exit 0
          fi
          git commit -m "fix(deps): remediate direct critical advisories [skip ci]"
          git push origin HEAD:ops/dependency-remediation-critical
