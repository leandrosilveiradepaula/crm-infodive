version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router)
  - React 19
  - Tailwind CSS v4
  - Supabase (Auth + PostgreSQL + Storage)
  - TanStack React Query
  - Zustand
  - Framer Motion
  - Radix UI / shadcn-ui
  - Recharts
  - Lucide React
  - Sonner (toasts)
routes:
  - path: /login
    file: src/app/login/page.tsx
    auth_required: false
    description: User login page with email/password and Office 365 OAuth
  - path: /auth/callback
    file: src/app/auth/callback/route.ts
    auth_required: false
    description: OAuth callback handler for Supabase Auth
  - path: /dashboard
    file: src/app/(dashboard)/dashboard/page.tsx
    auth_required: true
    description: Main dashboard with KPIs, charts, and activity feed
  - path: /pipeline
    file: src/app/(dashboard)/pipeline/page.tsx
    auth_required: true
    description: Kanban board for sales pipeline deal management
  - path: /leads
    file: src/app/(dashboard)/leads/page.tsx
    auth_required: true
    description: Lead management with table view and CRUD
  - path: /accounts
    file: src/app/(dashboard)/accounts/page.tsx
    auth_required: true
    description: Corporate account management with detail views
  - path: /contacts
    file: src/app/(dashboard)/contacts/page.tsx
    auth_required: true
    description: Contact people management linked to accounts
  - path: /customers
    file: src/app/(dashboard)/customers/page.tsx
    auth_required: true
    description: Legacy customer view
  - path: /products
    file: src/app/(dashboard)/products/page.tsx
    auth_required: true
    description: Product catalog management with categories and pricing
  - path: /proposals
    file: src/app/(dashboard)/proposals/page.tsx
    auth_required: true
    description: Commercial proposal listing and management
  - path: /proposals/[id]/editor
    file: src/app/proposals/[id]/editor/page.tsx
    auth_required: true
    description: Full-screen proposal creation and editing wizard
  - path: /contracts
    file: src/app/(dashboard)/contracts/page.tsx
    auth_required: true
    description: Contract management with digital signatures
  - path: /activities
    file: src/app/(dashboard)/activities/page.tsx
    auth_required: true
    description: Task, meeting, call, email, and note management
  - path: /sales
    file: src/app/(dashboard)/sales/page.tsx
    auth_required: true
    description: Sales tracking and post-sales operations
  - path: /sales-orders
    file: src/app/(dashboard)/sales-orders/page.tsx
    auth_required: true
    description: Sales order management and fulfillment
  - path: /purchases
    file: src/app/(dashboard)/purchases/page.tsx
    auth_required: true
    description: Purchase order management from distributors
  - path: /price-lists
    file: src/app/(dashboard)/price-lists/page.tsx
    auth_required: true
    description: Price list management with distributor pricing
  - path: /goals
    file: src/app/(dashboard)/goals/page.tsx
    auth_required: true
    description: Sales goals configuration per user
  - path: /goals-commissions
    file: src/app/(dashboard)/goals-commissions/page.tsx
    auth_required: true
    description: Commission calculator and goal scenarios
  - path: /reports
    file: src/app/(dashboard)/reports/page.tsx
    auth_required: true
    description: Analytics dashboards and report generation
  - path: /automations
    file: src/app/(dashboard)/automations/page.tsx
    auth_required: true
    description: Workflow automation rule builder
  - path: /gamification
    file: src/app/(dashboard)/gamification/page.tsx
    auth_required: true
    description: Sales team gamification features
  - path: /inbox
    file: src/app/(dashboard)/inbox/page.tsx
    auth_required: true
    description: Email inbox via Office 365 integration
  - path: /integrations
    file: src/app/(dashboard)/integrations/page.tsx
    auth_required: true
    description: Third-party integrations, API keys, webhooks
  - path: /settings
    file: src/app/(dashboard)/settings/page.tsx
    auth_required: true
    description: System settings and user management
  - path: /portal
    file: src/app/portal/page.tsx
    auth_required: false
    description: Client-facing portal for viewing and signing proposals
features:
  - name: User Authentication
    description: Login with email/password or Office 365 OAuth. Session management via Supabase Auth with middleware-based route protection.
    files:
      - src/app/login/page.tsx
      - src/components/auth/
      - src/hooks/useAuth.ts
      - src/middleware.ts
    entry_route: /login
    user_interactions:
      - Fill email input field
      - Fill password input field
      - Click Login button to submit
      - Click "Login with Office 365" button for OAuth
      - See error message on invalid credentials
      - Redirected to /dashboard on success
    api_calls:
      - method: POST
        endpoint: Supabase Auth signInWithPassword
      - method: POST
        endpoint: Supabase Auth signInWithOAuth (Azure)
    auth_required: false
  - name: Dashboard Overview
    description: Executive dashboard with KPI cards (pipeline value, deals won, conversion rate, revenue), sales funnel chart, recent activities, and commission widget with privacy toggle.
    files:
      - src/app/(dashboard)/dashboard/page.tsx
      - src/components/dashboard/
      - src/hooks/useDashboardMetrics.ts
      - src/services/DashboardService.ts
    entry_route: /dashboard
    user_interactions:
      - View KPI cards with real-time metrics
      - Toggle commission privacy (blur/show values)
      - View sales funnel chart
      - Click on recent activities
      - Filter by date range
    api_calls:
      - method: GET
        endpoint: Supabase RPC dashboard metrics
    auth_required: true
  - name: Pipeline Kanban Board
    description: Visual drag-and-drop Kanban board for managing deals across pipeline stages. Includes deal cards with health scores, stagnation alerts, and quick actions.
    files:
      - src/app/(dashboard)/pipeline/page.tsx
      - src/components/pipeline/
      - src/hooks/useDeals.ts
      - src/services/DealService.ts
    entry_route: /pipeline
    user_interactions:
      - Drag deal cards between pipeline stages
      - Click deal card to open detail view
      - Create new deal via button
      - Filter deals by owner, value, tags
      - View deal health score and stagnation indicators
      - Edit deal details in modal/slide panel
      - Add products to a deal
      - Manage deal quotes
    api_calls:
      - method: GET
        endpoint: Supabase select from deals
      - method: PATCH
        endpoint: Supabase update deal stage
      - method: POST
        endpoint: Supabase insert deal
    auth_required: true
  - name: Lead Management
    description: Capture and qualify potential sales leads. Supports lead creation with Brazilian business fields (CNPJ, IE) and conversion to deals.
    files:
      - src/app/(dashboard)/leads/page.tsx
      - src/components/leads/
      - src/hooks/useDeals.ts
      - src/services/LeadService.ts
    entry_route: /leads
    user_interactions:
      - View leads in table format
      - Create new lead with company, contact, and address info
      - Edit lead details
      - Change lead status (Novo, Qualificado, Convertido, Perdido)
      - Convert lead to deal
      - Delete lead
      - Search and filter leads
    api_calls:
      - method: GET
        endpoint: Supabase select from leads
      - method: POST
        endpoint: Supabase insert lead
      - method: PATCH
        endpoint: Supabase update lead
      - method: DELETE
        endpoint: Supabase delete lead
    auth_required: true
  - name: Account Management
    description: Manage B2B corporate accounts with multiple branches, contacts, assets, service contracts, and documents.
    files:
      - src/app/(dashboard)/accounts/page.tsx
      - src/components/customers/
      - src/hooks/useAccounts.ts
      - src/services/AccountService.ts
    entry_route: /accounts
    user_interactions:
      - View accounts list with search and filters
      - Create new account with CNPJ, address, segment
      - View account details with tabs (info, contacts, branches, assets, contracts, documents)
      - Add/edit branches per account
      - Add/edit contacts per account
      - Upload documents per account
      - Set account status (Ativo/Inativo)
      - Add tags
    api_calls:
      - method: GET
        endpoint: Supabase select from accounts
      - method: POST
        endpoint: Supabase insert account
      - method: PATCH
        endpoint: Supabase update account
    auth_required: true
  - name: Contact Management
    description: Manage contact people linked to corporate accounts with multiple phone types and LinkedIn profiles.
    files:
      - src/app/(dashboard)/contacts/page.tsx
      - src/components/contacts/
      - src/hooks/useContacts.ts
      - src/services/ContactService.ts
    entry_route: /contacts
    user_interactions:
      - View contacts list
      - Create new contact with name, email, phones, role
      - Link contact to account
      - Set primary contact flag
      - Edit contact details
      - Delete contact
      - Parse business card/signature image
    api_calls:
      - method: GET
        endpoint: Supabase select from contacts
      - method: POST
        endpoint: Supabase insert contact
      - method: PATCH
        endpoint: Supabase update contact
    auth_required: true
  - name: Product Catalog
    description: Manage product catalog with categories, SKUs, brands, and margin configuration for sales quoting.
    files:
      - src/app/(dashboard)/products/page.tsx
      - src/components/products/
      - src/hooks/useProducts.ts
      - src/services/ProductService.ts
    entry_route: /products
    user_interactions:
      - View products in list/grid
      - Create new product with name, SKU, category, brand, margin
      - Edit product details in slide panel
      - Filter by category, brand
      - Search products
      - Delete product
    api_calls:
      - method: GET
        endpoint: Supabase select from products
      - method: POST
        endpoint: Supabase insert product
      - method: PATCH
        endpoint: Supabase update product
      - method: DELETE
        endpoint: Supabase delete product
    auth_required: true
  - name: Proposal Management
    description: Generate, edit, and send commercial proposals with AI assistance. Multi-format export (PDF, DOCX, PPTX). Digital signature support and client portal.
    files:
      - src/app/(dashboard)/proposals/page.tsx
      - src/app/proposals/[id]/editor/page.tsx
      - src/components/proposals/
      - src/hooks/useProposals.ts
      - src/hooks/useProposalGenerator.ts
      - src/hooks/useProposalPdf.ts
      - src/hooks/useProposalDocx.ts
      - src/hooks/useProposalPpt.ts
      - src/hooks/useProposalIntelligence.ts
      - src/hooks/useProposalEditorState.ts
      - src/services/ProposalService.ts
    entry_route: /proposals
    user_interactions:
      - View proposal list with status filters
      - Create new proposal linked to a deal
      - Open full-screen proposal editor wizard
      - Add/remove product line items
      - Configure discount, tax, terms
      - Generate AI summary
      - Export as PDF, DOCX, or PPTX
      - Send proposal to client
      - Track proposal status (draft, sent, viewed, signed, rejected)
      - View proposal versions
    api_calls:
      - method: GET
        endpoint: Supabase select from proposals
      - method: POST
        endpoint: Supabase insert proposal
      - method: PATCH
        endpoint: Supabase update proposal
      - method: POST
        endpoint: Google Gemini AI generation
    auth_required: true
  - name: Contract Management
    description: Manage sales contracts with digital signature workflow. Supports service, NDA, and sales contract types.
    files:
      - src/app/(dashboard)/contracts/page.tsx
      - src/components/contracts/
      - src/hooks/useContracts.ts
      - src/services/ContractService.ts
    entry_route: /contracts
    user_interactions:
      - View contracts list
      - Create new contract linked to deal/proposal
      - View contract document
      - Send contract for signature
      - Track status (draft, sent, viewed, signed, declined)
      - Capture digital signature
    api_calls:
      - method: GET
        endpoint: Supabase select from contracts
      - method: POST
        endpoint: Supabase insert contract
      - method: PATCH
        endpoint: Supabase update contract
    auth_required: true
  - name: Activity Management
    description: Track tasks, meetings, calls, emails, and notes. AI-powered activity suggestions. Calendar and list views with priority and status management.
    files:
      - src/app/(dashboard)/activities/page.tsx
      - src/components/activities/
      - src/hooks/useActivities.ts
      - src/services/ActivityService.ts
      - src/services/ActivityAiService.ts
    entry_route: /activities
    user_interactions:
      - View activities in list or calendar view
      - Create new activity (task, meeting, call, email, note)
      - Set priority (low, medium, high, urgent)
      - Assign to team member
      - Set due date and time
      - Set reminders
      - Mark as completed
      - Add meeting details (location, attendees, duration)
      - Record outcome and next steps
      - Filter by type, status, priority, assignee, date
      - View AI-suggested activities
    api_calls:
      - method: GET
        endpoint: Supabase select from activities
      - method: POST
        endpoint: Supabase insert activity
      - method: PATCH
        endpoint: Supabase update activity
    auth_required: true
  - name: Sales Orders
    description: Sales order management and fulfillment tracking.
    files:
      - src/app/(dashboard)/sales-orders/page.tsx
      - src/components/sales/
      - src/hooks/useSalesOrders.ts
      - src/services/SalesService.ts
    entry_route: /sales-orders
    user_interactions:
      - View sales orders list
      - Create new sales order
      - Track order status
      - View order details with line items
      - Filter and search orders
    api_calls:
      - method: GET
        endpoint: Supabase select from sales_orders
      - method: POST
        endpoint: Supabase insert sales_order
    auth_required: true
  - name: Goals and Commissions
    description: Configure sales goals per user with quarterly breakdowns. Commission calculator with rules by product category. Financial scenario modeling.
    files:
      - src/app/(dashboard)/goals/page.tsx
      - src/app/(dashboard)/goals-commissions/page.tsx
      - src/components/goals/
    entry_route: /goals
    user_interactions:
      - Set yearly and monthly goals per seller
      - Configure quarterly goal distribution
      - Define commission rules by category (hardware, software, services)
      - Create financial scenarios with costs and margins
      - View goal progress vs actual
      - Toggle commission value privacy
    api_calls:
      - method: GET
        endpoint: Supabase select from user goals
      - method: PATCH
        endpoint: Supabase update goals
    auth_required: true
  - name: Reports and Analytics
    description: Business intelligence dashboards with sales performance, pipeline analytics, and team comparison charts.
    files:
      - src/app/(dashboard)/reports/page.tsx
      - src/hooks/useReports.ts
    entry_route: /reports
    user_interactions:
      - View sales performance charts
      - Filter by date range
      - Compare team member performance
      - View pipeline analytics
      - Export report data
    api_calls:
      - method: GET
        endpoint: Supabase RPC report queries
    auth_required: true
  - name: Workflow Automations
    description: Rule-based workflow automation with configurable triggers, conditions, and actions. Email template management.
    files:
      - src/app/(dashboard)/automations/page.tsx
      - src/components/automations/
      - src/services/AutomationService.ts
    entry_route: /automations
    user_interactions:
      - View automation rules list
      - Create new automation with trigger, conditions, actions
      - Select trigger type (deal moved, deal created, time-based, etc.)
      - Add conditions with field operators
      - Configure actions (create task, send email, move deal, etc.)
      - Enable/disable automations
      - View execution history and statistics
      - Manage email templates
    api_calls:
      - method: GET
        endpoint: Supabase select from automations
      - method: POST
        endpoint: Supabase insert automation
      - method: PATCH
        endpoint: Supabase update automation
    auth_required: true
  - name: Integrations and API
    description: Manage third-party integrations, generate API keys, and configure webhooks.
    files:
      - src/app/(dashboard)/integrations/page.tsx
      - src/components/integrations/
      - src/hooks/useApiKeys.ts
      - src/hooks/useWebhooks.ts
    entry_route: /integrations
    user_interactions:
      - View connected integrations
      - Connect/disconnect integrations
      - Generate API keys
      - Revoke API keys
      - Create webhooks with event subscriptions
      - View webhook delivery status
      - View audit logs
    api_calls:
      - method: GET
        endpoint: Supabase select from integrations
      - method: POST
        endpoint: Supabase insert api_key
      - method: PATCH
        endpoint: Supabase update integration
    auth_required: true
  - name: Settings
    description: System administration including user management, role assignment, and pipeline configuration.
    files:
      - src/app/(dashboard)/settings/page.tsx
      - src/components/settings/
      - src/hooks/useUsers.ts
      - src/services/SettingsService.ts
      - src/services/UserService.ts
    entry_route: /settings
    user_interactions:
      - View user list
      - Create new user with role assignment
      - Edit user roles and permissions
      - Deactivate users
      - Configure pipeline stages
      - Update organization settings
    api_calls:
      - method: GET
        endpoint: Supabase select from profiles
      - method: POST
        endpoint: Supabase Auth admin create user
      - method: PATCH
        endpoint: Supabase update profile
    auth_required: true
  - name: Client Portal
    description: Public-facing portal for clients to view proposals and provide digital signatures without authentication.
    files:
      - src/app/portal/page.tsx
      - src/components/portal/
    entry_route: /portal
    user_interactions:
      - View proposal details via public token
      - Review product line items and pricing
      - Accept or reject proposal
      - Provide digital signature
    api_calls:
      - method: GET
        endpoint: Supabase select proposal by public_token
      - method: PATCH
        endpoint: Supabase update proposal status and signature
    auth_required: false
  - name: Price List Management
    description: Manage pricing tables with distributor-specific pricing and multi-currency support (BRL/USD).
    files:
      - src/app/(dashboard)/price-lists/page.tsx
      - src/hooks/usePriceLists.ts
    entry_route: /price-lists
    user_interactions:
      - View price lists
      - Create/edit price list
      - Import prices from Excel
      - Export prices to Excel
      - Configure USD/BRL exchange rates
    api_calls:
      - method: GET
        endpoint: Supabase select from price_lists
      - method: POST
        endpoint: Supabase insert price_list
    auth_required: true
  - name: Purchase Orders
    description: Manage purchase orders from distributors for supply chain operations.
    files:
      - src/app/(dashboard)/purchases/page.tsx
      - src/components/supply-chain/
      - src/hooks/usePurchaseOrders.ts
      - src/services/DistributorOrderService.ts
    entry_route: /purchases
    user_interactions:
      - View purchase orders list
      - Create purchase order for distributor
      - Track order status
      - View order details
    api_calls:
      - method: GET
        endpoint: Supabase select from distributor_orders
      - method: POST
        endpoint: Supabase insert distributor_order
    auth_required: true
known_limitations:
  - issue: Email inbox requires Office 365 OAuth configuration with Azure AD
    location: src/app/(dashboard)/inbox/page.tsx
    impact: Email features are non-functional without proper Azure AD app registration and Supabase provider configuration
  - issue: AI features require Google Gemini API key
    location: src/services/ActivityAiService.ts
    impact: AI proposal generation and activity suggestions will fail without GEMINI_API_KEY in environment variables
  - issue: Application UI is entirely in Brazilian Portuguese (pt-BR)
    location: All components
    impact: All labels, status values, and form fields use Portuguese language
